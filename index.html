<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ploop prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@400;600;800&family=Gochi+Hand&family=Caveat:wght@500;700&display=swap">
<style>
/* VOICE: soft, playful, handmade — a shared scrapbook
   IDEA: a little apartment hallway: doors, a room, a gacha machine, a shelf of zines
   PICTURE: the phone itself, built from the Figma frames
   COLOUR and TYPE: each group's door + wall colour; Grandstander UI, Gochi Hand notes, Caveat zine handwriting
   LAYOUT: phone centred, test tools beside it (bottom drawer on phones) */
:root{color-scheme:light dark;--bg:light-dark(#eceef2,#17181b);--ink:light-dark(#22232a,#e9e9ee);--card:light-dark(#fff,#24252a);--line:light-dark(#d9dbe2,#34363d)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Grandstander,ui-rounded,system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea{font:inherit;font-size:16px}
#stage{height:100%;display:flex;align-items:center;justify-content:center;gap:28px;padding:20px}
#phoneWrap{position:relative;flex:none}
#phone{position:absolute;left:0;top:0;width:402px;height:874px;transform-origin:0 0;overflow:hidden;border-radius:44px;background:#bfdcf7;box-shadow:0 0 0 10px #1d1e22,0 30px 60px rgba(0,0,0,.25);font-family:Grandstander,ui-rounded,sans-serif;color:#2a2733;user-select:none;-webkit-user-select:none;touch-action:manipulation}
body.mobile #stage{padding:0}
body.mobile #phone{border-radius:0;box-shadow:none}
#dev{width:300px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;font-size:15px}
#dev h1{font-size:22px;line-height:1.1;margin:0 0 4px}
#dev p{margin:0 0 12px;opacity:.75;font-size:14px}
#dev button{display:block;width:100%;text-align:left;padding:11px 12px;margin:6px 0;border-radius:12px;background:light-dark(#f1f2f6,#2e3036);min-height:44px}
#dev button:hover{background:light-dark(#e5e7ee,#383a41)}
#dev button:focus-visible,#phone button:focus-visible{outline:3px solid #6f7be0;outline-offset:2px}
#dev small{display:block;margin-top:10px;opacity:.65;font-size:13px}
#mode{display:block;padding:8px 10px;border-radius:10px;background:light-dark(#eef6ee,#22322a);font-size:13px;margin-bottom:8px}
#devToggle{display:none}
body.mobile #dev{position:fixed;left:8px;right:8px;bottom:8px;width:auto;z-index:50;transform:translateY(120%);transition:transform .3s}
body.mobile #dev.open{transform:none}
body.mobile #devToggle{display:block;position:fixed;right:10px;bottom:10px;z-index:51;background:rgba(30,30,40,.7);color:#fff;border-radius:20px;padding:8px 14px;font-size:13px}

.screen{position:absolute;inset:0;display:none;overflow:hidden}
.screen.on{display:block}
.a-zin{animation:zin .42s cubic-bezier(.2,.8,.3,1) both}
.a-fade{animation:fade .35s both}
.a-up{animation:up .4s cubic-bezier(.2,.8,.3,1) both}
@keyframes zin{from{opacity:0;transform:scale(.82)}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{opacity:0;transform:translateY(30px)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
.back{position:absolute;left:22px;top:58px;width:48px;height:48px;z-index:8;display:grid;place-items:center}
.back svg{width:34px;height:38px}
.blue{background:#bfdcf7}
.btn{background:#ffb6b6;border-radius:24px;height:46px;padding:0 28px;font-weight:600;font-size:17px;color:#2a2733;box-shadow:0 3px 0 rgba(0,0,0,.06)}
.btn:disabled{opacity:.45}
.btn.wide{position:absolute;left:50%;transform:translateX(-50%);bottom:40px;width:200px}
.field{display:block;width:100%;border:0;border-bottom:1.5px solid #6e7ea8;background:transparent;padding:6px 0;outline:none;color:#2a2733}
.field::placeholder{color:#7f8aa6}
.dots{position:absolute;top:60px;left:0;right:0;display:flex;justify-content:center;gap:10px}
.dots i{width:7px;height:7px;border-radius:50%;background:#f7b9b9;opacity:.35}.dots i.on{opacity:1}
.ttl{font-size:21px;font-weight:600;margin:0 0 10px}
.toast{position:absolute;left:50%;top:44px;transform:translate(-50%,-160%);background:#2a2733;color:#fff;padding:10px 18px;border-radius:22px;font-size:15px;z-index:90;transition:transform .35s cubic-bezier(.2,.8,.3,1);max-width:340px;text-align:center;pointer-events:none}
.toast.on{transform:translate(-50%,0)}
#fx{position:absolute;inset:0;pointer-events:none;z-index:60}
#fx>*{pointer-events:auto}
.scrim{position:absolute;inset:0;background:rgba(30,28,40,.35);z-index:70;animation:fade .25s both}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:28px 28px 0 0;padding:22px 24px 34px;z-index:71;animation:up .35s cubic-bezier(.2,.8,.3,1) both;max-height:80%;overflow-y:auto}
.sheet h3{margin:0 0 14px;font-size:20px}
.row{display:flex;gap:10px;align-items:center}
.ghost{background:#eef0f6;border-radius:24px;height:46px;padding:0 22px;font-weight:600}
.muted{color:#7d7590;font-size:14px}

.hints{position:absolute;inset:0;pointer-events:none;z-index:40;animation:fade .6s .3s both}
.note{position:absolute;background:#fbfbfb;padding:9px 10px 7px;font:15px/1.02 'Gochi Hand',cursive;color:#1b1b1b;box-shadow:0 2px 6px rgba(0,0,0,.1);width:var(--w,96px)}
.note::before{content:"";position:absolute;top:-9px;right:12px;width:30px;height:12px;background:#86c5f7;transform:rotate(-32deg);opacity:.95}
.arr{position:absolute;width:60px;height:40px;transform-origin:0 50%}

/* sign in */
.logo{position:absolute;left:0;right:0;top:200px;text-align:center}
.logo b{font:800 80px/1 Grandstander;letter-spacing:-1px;color:#141318}
.logo p{margin:8px 0 0;color:#6f6a7c;font-size:17px}
.recent{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.recent button{background:#fff;border-radius:18px;padding:8px 14px;font-weight:600;font-size:15px;min-height:40px;box-shadow:0 2px 4px rgba(0,0,0,.06)}
.badge{display:inline-block;background:rgba(255,255,255,.7);border-radius:12px;padding:6px 10px;font-size:12px;color:#4d5b78;line-height:1.25}

/* door */
.doors{position:absolute;inset:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.doors::-webkit-scrollbar{display:none}
.dpage{position:relative;flex:0 0 402px;height:874px;scroll-snap-align:start;overflow:hidden;perspective:1100px;background:var(--w)}
.door{position:absolute;inset:0;background:var(--d);transform-origin:100% 50%;transition:transform .9s cubic-bezier(.5,0,.3,1),filter .9s}
.door.open{transform:rotateY(78deg);filter:brightness(.8)}
.pn{position:absolute;background:var(--p)}
.dname{position:absolute;left:14px;right:14px;top:298px;height:80px;display:flex;justify-content:center;align-items:center;z-index:2}
.dname span{font:800 44px/1 Grandstander,sans-serif;color:#fff;-webkit-text-stroke:2px #9fd2ff;paint-order:stroke fill;display:inline-block;margin:0 1px}
.handle{position:absolute;left:12px;top:396px;width:150px;height:110px;z-index:3}
.handle .base{position:absolute;left:5px;top:2px;width:52px;height:100px;border-radius:26px;background:var(--hb)}
.handle .lever{position:absolute;left:26px;top:40px;width:100px;height:22px;border-radius:11px;background:var(--hl);transform-origin:11px 11px;transition:transform .35s}
.handle.turn .lever{transform:rotate(32deg)}
.slot{position:absolute;left:100px;top:624px;width:202px;height:46px;background:#dadada;border:2px solid #c4c4c4;border-radius:3px;z-index:3}
.slot::before{content:"";position:absolute;left:12px;right:12px;top:9px;bottom:9px;background:#a9a9a9;border-bottom:3px solid #6e6e6e;transition:background .2s}
.slot.open::before{background:#5a5a5a}
.slot i{position:absolute;width:4px;height:4px;border-radius:50%;background:#9a9a9a}
.photo{position:absolute;left:152px;top:372px;width:206px;height:156px;background:#fff;padding:9px;transform:rotate(-5deg);box-shadow:0 3px 8px rgba(0,0,0,.12);z-index:2}
.photo .in{width:100%;height:100%;background:#e9e9e9;overflow:hidden;display:grid;place-items:center}
.photo .in img,.photo .in svg{width:100%;height:100%;object-fit:cover;display:block}
.photo::after{content:"";position:absolute;top:-10px;left:70px;width:72px;height:18px;background:#86c5f7;opacity:.9;transform:rotate(2deg)}
.pins{position:absolute;left:30px;right:30px;top:706px;height:124px;display:flex;justify-content:center;gap:22px;z-index:2}
.pinz{width:84px;height:104px;background:#fff;padding:5px;box-shadow:0 3px 6px rgba(0,0,0,.15);position:relative}
.pinz::after{content:"";position:absolute;top:-8px;left:24px;width:36px;height:13px;background:#86c5f7;opacity:.9}
.pinz .g{width:100%;height:100%;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:1px;background:var(--bc);overflow:hidden}
.pinz .g>*{width:100%;height:100%;overflow:hidden}
.mini svg,.mini img{width:100%;height:100%;object-fit:cover;display:block}
.newdoor .door{filter:grayscale(1) blur(1.2px);opacity:.55}
.plus{position:absolute;left:131px;top:380px;width:140px;height:140px;z-index:3}
.plus::before,.plus::after{content:"";position:absolute;background:#111;border-radius:4px}
.plus::before{left:64px;top:0;width:10px;height:140px}.plus::after{top:64px;left:0;height:10px;width:140px}
.dotsd{position:absolute;bottom:24px;left:0;right:0;display:flex;justify-content:center;gap:8px;z-index:10;pointer-events:none}
.dotsd i{width:8px;height:8px;border-radius:50%;background:#fff;opacity:.45}.dotsd i.on{opacity:1}
.me{position:absolute;right:18px;top:54px;width:48px;height:48px;border-radius:50%;background:#fff;z-index:12;overflow:hidden;display:grid;place-items:center;font-weight:800;font-size:20px;color:#7381d1;box-shadow:0 2px 8px rgba(0,0,0,.15);border:3px solid #fff}
.me img{width:100%;height:100%;object-fit:cover}

/* room */
.room{position:absolute;inset:0;background:var(--w);transition:transform .45s cubic-bezier(.5,0,.3,1),opacity .45s}
.room.zoom{transform:scale(2.8);opacity:0}
.floor{position:absolute;left:0;right:0;top:801px;bottom:0;background:var(--f)}
.plank{position:absolute;left:-2px;height:9px;background:#d4d4d4;border-radius:0 5px 5px 0}
.plank::after{content:"";position:absolute;left:0;top:9px;height:30px;right:-28px;background:var(--f);opacity:.55;transform:skewX(-12deg);transform-origin:0 0;border-radius:0 8px 8px 0}
.spines{position:absolute;left:14px;display:flex;align-items:flex-end;gap:2px}
.spine{width:21px;height:var(--h,56px);border-radius:3px 3px 0 0;font:700 10px/1 Grandstander;writing-mode:vertical-rl;transform:none;display:flex;align-items:center;justify-content:center;color:#2a2733;box-shadow:inset -3px 0 0 rgba(0,0,0,.06)}
.table{position:absolute;left:-10px;top:652px;width:172px;height:16px;background:#a8845f;border-radius:0 8px 8px 0}
.table::after{content:"";position:absolute;left:130px;top:16px;width:12px;height:150px;background:#a8845f;border-radius:0 0 4px 4px}
.hit{position:absolute;z-index:4}
.machine{position:absolute;width:314px;height:605px;transform-origin:0 0}
.machine .lid{position:absolute;left:0;top:0;width:314px;height:38px;border-radius:19px;background:var(--d)}
.machine .glass{position:absolute;left:0;top:39px;width:314px;height:240px;border-radius:18px;background:rgba(255,255,255,.22);border:1.5px solid rgba(255,255,255,.75);overflow:hidden;box-shadow:inset 0 0 30px rgba(255,255,255,.35)}
.machine .neck{position:absolute;left:0;top:281px;width:314px;height:36px;border-radius:18px;background:#cfcfcf}
.machine .base{position:absolute;left:0;top:318px;width:314px;height:288px;border-radius:22px;background:var(--d);box-shadow:0 6px 0 rgba(0,0,0,.08)}
.machine .out{position:absolute;left:33px;top:402px;width:119px;height:117px;border-radius:9px;background:#4a4a4a;overflow:hidden}
.machine .knob{position:absolute;left:168px;top:404px;width:118px;height:118px;border-radius:50%;background:#d0d0d0}
.machine .knob::after{content:"";position:absolute;left:40px;top:0;width:38px;height:118px;border-radius:10px;background:#555}
.machine .knob.glow{box-shadow:0 0 0 6px rgba(255,255,255,.6),0 0 24px 6px #fff6a8}
.pill{position:absolute;width:70px;height:48px;border-radius:24px;background:linear-gradient(90deg,var(--c) 0 50%,#dfe9ee 50%);box-shadow:inset 0 -4px 0 rgba(0,0,0,.05)}
.pill .lk{position:absolute;left:21px;top:10px;width:28px;height:28px}
.pot{position:absolute;background:#f8f8f8;border-radius:16px 16px 70px 70px/16px 16px 60px 60px;box-shadow:0 4px 10px rgba(0,0,0,.12),inset 0 -6px 0 rgba(0,0,0,.03)}
.peek{position:absolute;background:#f6f1e3;padding:3px;box-shadow:0 1px 3px rgba(0,0,0,.15);filter:blur(1.4px);overflow:hidden}
.peek>*{width:100%;height:100%;object-fit:cover;display:block}

/* capsule */
.cbar{position:absolute;left:0;right:0;top:0;height:166px;background:rgba(150,180,215,.35);border-radius:0 0 36px 36px;padding:62px 24px 0 38px;display:flex;justify-content:space-between;gap:12px;color:#8e7ad0}
.cbar h2{margin:0;font-size:17px;line-height:1.06;font-weight:600;max-width:190px}
.cbar p{margin:6px 0 0;font-size:11px;line-height:1.15;color:#7d7590;max-width:170px}
.cbar .ready{flex:none;background:#d08faf;color:#fff;border-radius:30px;height:64px;padding:0 24px;font-size:18px;font-weight:600;align-self:flex-start;margin-top:-12px}
.cbar .ready:disabled{opacity:.5}
.cbar a{color:#8e7ad0;text-decoration:underline;font-size:12px;cursor:pointer}
.fab{position:absolute;left:168px;top:762px;width:66px;height:66px;border-radius:50%;background:#d08faf;display:grid;place-items:center;box-shadow:0 3px 6px rgba(0,0,0,.15);z-index:6}
.fab::before,.fab::after{content:"";position:absolute;background:#fff;border-radius:2px}
.fab::before{width:36px;height:3.5px}.fab::after{width:3.5px;height:36px}

/* editor */
.ed-top{position:absolute;right:30px;top:68px;display:flex;gap:8px;z-index:6}
.sv{background:#bfe3b4;border-radius:10px;padding:3px 12px;font-weight:600;min-height:34px}
.dl{background:#e07878;color:#fff;border-radius:10px;padding:3px 12px;font-weight:600;min-height:34px}
.card{position:absolute;left:26px;top:118px;width:350px;height:640px;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.card .empty{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;color:#8a8a8a;padding:30px;text-align:center;pointer-events:none}
.el{position:absolute;touch-action:none;cursor:grab}
.el img{width:100%;height:auto;display:block;pointer-events:none}
.el.sel{outline:1px dashed rgba(142,122,208,.7);outline-offset:2px}
.el .x,.el .rs{position:absolute;width:26px;height:26px;border-radius:50%;background:rgba(142,122,208,.92);color:#fff;font-size:14px;line-height:26px;text-align:center;display:none;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.el.sel .x,.el.sel .rs{display:block}
.el .x{left:-14px;top:-14px}.el .rs{right:-14px;bottom:-14px;touch-action:none}
.tools{position:absolute;left:0;right:0;top:740px;height:134px;z-index:7}
.tool{position:absolute;touch-action:none}
.tool svg{width:100%;height:100%;display:block;pointer-events:none}
.ghostdrag{position:absolute;width:70px;height:70px;opacity:.8;pointer-events:none;z-index:80}
.ov{position:absolute;inset:0;z-index:30;background:rgba(191,220,247,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);animation:fade .25s both}
.panel{position:absolute;left:12px;right:12px;top:18px;bottom:24px;background:#cfdcef;border-radius:20px;box-shadow:0 4px 18px rgba(0,0,0,.08)}
.stk{position:absolute;left:22px;right:22px;top:20px;bottom:120px;background:#fff;border-radius:14px;overflow-y:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:14px;align-items:center;justify-items:center}
.stk button{width:96px;height:96px;display:grid;place-items:center;border-radius:12px}
.stk img{max-width:92px;max-height:92px}
.ptitle{position:absolute;left:0;right:0;bottom:44px;text-align:center;font-size:30px;font-weight:600}
.pbtns{position:absolute;right:20px;bottom:26px;display:flex;flex-direction:column;gap:8px}
.padwrap{position:absolute;left:28px;top:40px;width:322px;height:420px;background:#cfdcef;border-radius:20px}
.pad{position:absolute;left:11px;top:30px;width:300px;height:270px;background:#fff;touch-action:none}
.pad.tri{clip-path:polygon(50% 0,100% 100%,0 100%)}
.pad.circ{border-radius:50%}
.pad.rect{border-radius:6px}
.padlabel{position:absolute;left:0;right:0;bottom:34px;text-align:center;font-size:28px;font-weight:600}
.drawtools{position:absolute;left:28px;top:476px;right:28px;display:flex;gap:16px;align-items:flex-start}
.tbox{width:96px;height:92px;border-radius:16px;background:#cfdcef;display:grid;place-items:center}
.tbox.on{background:#aebfe0}
.vs{writing-mode:vertical-lr;direction:rtl;width:28px;height:200px;appearance:none;-webkit-appearance:none;border-radius:14px;background:#e3e3e3}
.vs.rain{background:linear-gradient(to top,#000 0 8%,#f06 8%,#f80,#fd0,#7e4,#2dc,#39f,#a6f,#fbd 92%,#fff)}
.vs::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:#e07878;border:3px solid #fff}
.vs::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#e07878;border:3px solid #fff}
.sws{position:absolute;left:24px;right:24px;top:338px;display:flex;justify-content:center;gap:10px}.sws button{width:36px;height:36px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.2)}.sws button.on{outline:3px solid #7381d1}
.capwrap textarea{position:absolute;left:51px;top:110px;width:220px;height:130px;border:0;outline:none;resize:none;text-align:center;font:600 22px/1.15 Grandstander;background:transparent;color:#2a2733}

/* gacha + shelf + book */
.slotcap{position:absolute;left:24px;top:34px;transform:rotate(-12deg)}
.bigpill{position:absolute;left:91px;top:330px;width:220px;height:150px}
.bigpill .h{position:absolute;top:0;width:110px;height:150px;transition:transform .7s cubic-bezier(.3,0,.2,1)}
.bigpill .h.l{left:0;border-radius:75px 0 0 75px;background:var(--c)}
.bigpill .h.r{left:110px;border-radius:0 75px 75px 0;background:#e3ecf1}
.bigpill.split .h.l{transform:translate(-140px,-60px) rotate(-40deg)}
.bigpill.split .h.r{transform:translate(140px,60px) rotate(30deg)}
.tapnote{position:absolute;left:0;right:0;text-align:center;font:20px 'Gochi Hand';color:#4c4860}
.bookov{position:absolute;inset:0;background:var(--w);z-index:72}
.book{position:absolute;left:51px;top:150px;width:300px;height:450px;perspective:1400px}
.book .pages{position:absolute;inset:0;background:#fff;border:7px solid var(--c);display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:3px;padding:8px;overflow:hidden}
.book .pages>*{overflow:hidden;background:#dccdf0}
.book .cover{position:absolute;inset:0;background:var(--c);transform-origin:0 50%;transition:transform 1s cubic-bezier(.5,0,.25,1);display:grid;place-items:center;box-shadow:4px 4px 12px rgba(0,0,0,.12);backface-visibility:hidden;border-left:12px solid rgba(0,0,0,.06)}
.book .cover span{font:800 54px/1 Grandstander;writing-mode:vertical-rl;color:#1d1b22}
.book.open .cover{transform:rotateY(-168deg)}
.shelfboard{position:absolute;left:30px;top:531px;width:420px;height:44px;background:#d4d4d4;border-radius:22px 0 0 22px}
.shelfboard::after{content:"";position:absolute;left:10px;right:0;top:40px;height:34px;background:var(--f);opacity:.5;transform:skewY(2deg)}
.books{position:absolute;left:36px;right:0;top:280px;height:251px;display:flex;align-items:flex-end;gap:4px;overflow-x:auto;scrollbar-width:none;padding-right:40px}
.books::-webkit-scrollbar{display:none}
.bk{flex:none;width:60px;height:210px;border-radius:4px 4px 0 0;display:grid;place-items:center;transition:transform .3s;box-shadow:inset -5px 0 0 rgba(0,0,0,.06)}
.bk span{writing-mode:vertical-rl;transform:rotate(180deg);font:800 27px/1 Grandstander;color:#1d1b22}
.bk:hover{transform:translateY(-10px)}
.bk.pull{transform:translateY(-40px) scale(1.1)}
.emptyshelf{position:absolute;left:40px;right:40px;top:420px;text-align:center;font:19px 'Gochi Hand';color:#5b6375}

/* zine: fold-out puzzle */

<script>
{
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeImg=u=>typeof u==='string'&&/^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/.test(u)?u:null;
const phone=$('#phone'), screens=$('#screens'), fx=$('#fx');
const ART=n=>window.PLOOP_ART?window.PLOOP_ART(n):'';
let SC=1;
function fit(){const w=innerWidth,h=innerHeight,m=w<720;document.body.classList.toggle('mobile',m);
  SC=m?Math.min(w/402,h/874):Math.min((h-48)/874,(w-400)/402,1.1);
  phone.style.transform=`scale(${SC})`;$('#phoneWrap').style.width=402*SC+'px';$('#phoneWrap').style.height=874*SC+'px';}
addEventListener('resize',fit);fit();
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const nid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);

/* ================= storage ================= */
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
function LocalStore(key){
  let data=LS.get(key,{})||{};const subs=new Set();
  const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
  const meta={fromCache:false,hasPendingWrites:false};
  const snap=p=>{const b=data[p];return{id:p.split('/').pop(),exists:b!==undefined,data:()=>clone(b),metadata:meta}};
  const save=()=>{if(!LS.set(key,data)){const e=new Error('This device is out of storage space');e.code='quota_exceeded';throw e}};
  const notify=()=>queueMicrotask(()=>subs.forEach(f=>{try{f()}catch(e){console.error(e)}}));
  const isObj=v=>v&&typeof v==='object'&&!Array.isArray(v);
  const merge=(a,b)=>{for(const k in b){if(isObj(b[k])&&isObj(a[k]))merge(a[k],b[k]);else a[k]=clone(b[k])}return a};
  function docRef(p){return{id:p.split('/').pop(),path:p,
    get:async()=>snap(p),
    set:async d=>{data[p]=clone(d);save();notify()},
    update:async d=>{if(data[p]===undefined){const e=new Error('missing document');e.code='invalid_argument';throw e}merge(data[p],d);save();notify()},
    delete:async()=>{delete data[p];save();notify()},
    acquire:async()=>({acquired:true}),
    onSnapshot:next=>{const f=()=>next(snap(p));subs.add(f);queueMicrotask(f);return()=>subs.delete(f)}}}
  function query(c,filters){const depth=c.split('/').length+1;
    const run=()=>{const docs=Object.keys(data).filter(p=>p.startsWith(c+'/')&&p.split('/').length===depth).filter(p=>filters.every(([f,op,v])=>{const x=data[p][f];return op==='=='?x===v:op==='array-contains'?Array.isArray(x)&&x.includes(v):op==='in'?v.includes(x):true})).sort().map(snap);return{docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:meta}};
    return{path:c,where:(f,op,v)=>query(c,[...filters,[f,op,v]]),orderBy:()=>query(c,filters),limit:()=>query(c,filters),get:async()=>run(),
      onSnapshot:next=>{const f=()=>next(run());subs.add(f);queueMicrotask(f);return()=>subs.delete(f)},
      doc:id=>docRef(c+'/'+(id||nid())),add:async d=>{const r=docRef(c+'/'+nid());await r.set(d);return r}}}
  return{doc:docRef,collection:c=>query(c,[]),wipe(){data={};LS.del(key);notify()}};
}
const LOCAL=LocalStore('ploop.db.v2');
let DB=LOCAL, MODE='local';
async function initStore(){
  if(typeof window.claude?.use!=='function')return;
  try{const r=await Promise.race([Promise.all([window.claude.use('db'),window.claude.use('user')]),wait(9000).then(()=>null)]);
    if(r&&r[0]){let can=null;try{can=r[1]?await r[1].can('data.write'):null}catch(e){}
      if(can!==false){DB=r[0];MODE='cloud'}else MODE='local-readonly'}}catch(e){}
}
function useLocal(why){if(DB===LOCAL)return;DB=LOCAL;MODE='local';modeLabel();if(why)toast(why,3600)}
const MODE_TXT={cloud:'☁️ Saving to the shared test space — testers can find each other and share rooms','local-readonly':'👀 You can open the shared space but not save to it, so this account lives on this device only. Ask the owner to share the prototype with you as Contributor or Editor.',local:'📱 Saving on this device only (this browser) — only accounts made on this device can be friends'};
function modeLabel(){const m=$('#mode');m.textContent=MODE_TXT[MODE]||MODE_TXT.local;$('#wipeBtn').style.display=MODE==='cloud'?'none':'block'}
const gd=async p=>{const s=await DB.doc(p).get();return s.exists?{id:s.id,...s.data()}:null};
async function W(fn){try{return await fn()}catch(e){if(e&&e.code==='quota_exceeded'){toast('Storage is full — '+(MODE==='cloud'?'the test space can\'t take more':'clear this device in test tools'),4000)}else if(e&&e.code==='unavailable'){await wait(600+Math.random()*600);return await fn()}else{toast('Couldn\'t save that — try again');console.error(e)}throw e}}

/* ================= state ================= */
const BOTS=['Jamie','Allison','Jacob','Emily','Nina','Theo'];
const BOOK=['#ffb3b3','#bfe8c4','#dccbf0','#aab4e6','#fff5aa','#ffd3a8','#bde4f4'];
const PILL=['#5ec8f2','#d7b6ea','#f3e48a','#a6c8ec','#b8e8b0','#f4b2b2','#f6cfa6','#e9b8e8'];
const STICK=Array.from({length:19},(_,i)=>`img/s${String(i).padStart(2,'0')}.png`);
const MONTHS=['january','february','march','april','may','june','july','august','september','october','november','december'];
let ME=null;            // account
const ACC={};           // all accounts by id
let ROOMS=[],CAPS=[],CANV=[],RX=[];
let CUR=null;           // current room id
let BUSY=false;
const room=()=>ROOMS.find(r=>r.id===CUR)||null;
const isBot=id=>typeof id==='string'&&id.startsWith('bot:');
const dn=id=>id===ME?.id?'You':isBot(id)?id.slice(4):(ACC[id]?.name||id);
const list=a=>a.length<2?a.join(''):a.slice(0,-1).join(', ')+' and '+a.at(-1);
const capCur=r=>r?.cap?.id;
const readyMap=r=>(r?.ready&&r.ready[capCur(r)])||{};
const allReady=r=>r&&r.members.every(m=>readyMap(r)[m]);
let seen={};
const saveSeen=()=>ME&&LS.set('ploop.seen.'+ME.id,seen);

/* ================= subscriptions ================= */
let subs=[],rsubs=[],subRoomId=null,lastCap={};
const onErr=e=>{console.warn('db',e);if(e&&e.code==='revoked'){useLocal('Lost access to the shared space — saving on this device now')}};
function startSubs(){stopSubs();
  subs.push(DB.collection('accounts').onSnapshot(s=>{for(const k in ACC)delete ACC[k];s.docs.forEach(d=>ACC[d.id]={id:d.id,...d.data()});if(ME&&ACC[ME.id])ME=ACC[ME.id];changed()},onErr));
  subs.push(DB.collection('rooms').where('members','array-contains',ME.id).onSnapshot(s=>{ROOMS=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.created||0)-(b.created||0));
    if(!CUR||!room())CUR=ROOMS[0]?.id||null;roomWatch();subRoom(CUR);changed()},onErr));
}
function stopSubs(){subs.forEach(u=>u());subs=[];rsubs.forEach(u=>u());rsubs=[];subRoomId=null}
function subRoom(rid){if(subRoomId===rid)return;rsubs.forEach(u=>u());rsubs=[];subRoomId=rid;CAPS=[];CANV=[];RX=[];if(!rid)return;
  const map=s=>s.docs.map(d=>({id:d.id,...d.data()}));
  rsubs.push(DB.collection('capsules').where('room','==',rid).onSnapshot(s=>{CAPS=map(s);changed()},onErr));
  rsubs.push(DB.collection('canvases').where('room','==',rid).onSnapshot(s=>{CANV=map(s);changed()},onErr));
  rsubs.push(DB.collection('reactions').where('room','==',rid).onSnapshot(s=>{RX=map(s).sort((a,b)=>(a.at||0)-(b.at||0));changed()},onErr));
}
function setRoom(rid){CUR=rid;subRoom(rid)}
function roomWatch(){for(const r of ROOMS){const c=capCur(r);if(lastCap[r.id]&&lastCap[r.id]!==c&&r.id===CUR&&!closingNow.has(lastCap[r.id])&&['room','capsule','gacha'].includes(curScreen))toast('Everyone was ready — the capsule rolled into the gacha machine 🎉',3200);lastCap[r.id]=c;
  if(r.id===CUR&&allReady(r)&&r.members.includes(ME.id))tryClose(r)}}
let chT=0,lastScrollT=0;function changed(){cancelAnimationFrame(chT);chT=requestAnimationFrame(refresh)}
function refresh(){if(BUSY||!curScreen||!ME)return;const s=curScreen;
  if(['room','capsule','gacha','shelf','zine'].includes(s)&&!room()){show('doors');return}
  if(s==='doors'){if(Date.now()-lastScrollT<700){clearTimeout(refresh.t);refresh.t=setTimeout(changed,750);return}const dr=$('#dr');const sl=dr?dr.scrollLeft:0;render('doors');const d2=$('#dr');if(d2)d2.scrollLeft=sl}
  else if(s==='room'||s==='shelf'||s==='gacha')render(s);
  else if(s==='capsule'){const el=$('#s-capsule');drawBar(el);drawPot(el)}
  else if(s==='zine'&&zineRedraw)zineRedraw();
}

/* ================= helpers ================= */
function toast(t,ms=2400){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),ms)}
const BACK='<svg viewBox="0 0 34 38"><path d="M30 4 L4 19 L30 34 Z" fill="#a8aee8" stroke="#a8aee8" stroke-width="6" stroke-linejoin="round"/></svg>';
const LOCK='<svg class="lk" viewBox="0 0 28 28"><path d="M8 12V9a6 6 0 0 1 12 0v3" fill="none" stroke="#555" stroke-width="3.2"/><rect x="5" y="12" width="18" height="13" rx="3" fill="#5c5c5c"/><circle cx="14" cy="18" r="2" fill="#bbb"/></svg>';
const ARROW='<svg class="arr" viewBox="0 0 60 40"><path d="M3 30 C12 32 17 23 13 18 C9 13 3 19 9 24 C15 29 23 21 21 14 C19 8 12 11 16 17 C21 24 34 23 53 14" fill="none" stroke="#111" stroke-width="1.6" stroke-linecap="round"/><path d="M45 10 L54 14 L47 21" fill="none" stroke="#111" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function group(colors){const n=colors.length,w=190/n;return `<svg viewBox="0 0 190 140" preserveAspectRatio="xMidYMax slice"><rect width="190" height="140" fill="#ececec"/>${colors.map((c,i)=>{const x=10+i*(170/n)+w*.1,cx=x+w*.45,top=50+(i%2)*8;return `<path d="M${x-6} 142 Q${x} ${top+30} ${cx} ${top+26} Q${x+w*.95} ${top+30} ${x+w+8} 142Z" fill="${c}"/><circle cx="${cx}" cy="${top+12}" r="${w*.26}" fill="${c}"/><circle cx="${cx-4}" cy="${top+10}" r="1.6" fill="#333"/><circle cx="${cx+4}" cy="${top+10}" r="1.6" fill="#333"/><path d="M${cx-4} ${top+16} Q${cx} ${top+19} ${cx+4} ${top+16}" stroke="#333" stroke-width="1.4" fill="none"/>`}).join('')}</svg>`}

function nextSlot(){const d=new Date(Date.now()+(3+Math.random()*1.5)*864e5);d.setHours(10+Math.floor(Math.random()*11),Math.floor(Math.random()*60),0,0);return d.getTime()}

function local(e){const r=phone.getBoundingClientRect();return{x:(e.clientX-r.left)/SC,y:(e.clientY-r.top)/SC}}
function elPos(el){const r=el.getBoundingClientRect(),p=phone.getBoundingClientRect();return{x:(r.left-p.left)/SC,y:(r.top-p.top)/SC,w:r.width/SC,h:r.height/SC}}
function readImg(file,max=700){return new Promise(res=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.82))};im.onerror=()=>res(null);im.src=fr.result};fr.readAsDataURL(file)})}

function themeVars(r){return `--d:${r.d};--p:${r.p};--w:${r.w};--f:${r.f};--hb:${r.hb};--hl:${r.hl}`}
function avatarHTML(id){if(isBot(id))return esc(id.slice(4,5));const a=ACC[id]||(id===ME?.id?ME:null);const im=safeImg(a?.photo);return im?`<img src="${im}" alt="">`:esc((a?.name||id||'?').slice(0,1).toUpperCase())}

const hueOf=hex=>{const n=parseInt(hex.slice(1),16),R=(n>>16)/255,G=(n>>8&255)/255,B=(n&255)/255,mx=Math.max(R,G,B),mn=Math.min(R,G,B),d=mx-mn;if(!d)return 0;let h=mx===R?((G-B)/d)%6:mx===G?(B-R)/d+2:(R-G)/d+4;return Math.round((h*60+360)%360)};
function hsl(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,9-k(n),1));return'#'+[f(0),f(8),f(4)].map(x=>Math.round(x*255).toString(16).padStart(2,'0')).join('')}

const pillPos=i=>({x:12+((i*83)%230),y:172-Math.floor(i/3)*44-(i%2)*10,r:(i*47%60)-30});

/* ================= hints ================= */
const HINTS={
 door:[{t:'Tap to change group name',x:262,y:226,r:5,a:[248,282,150]},{t:'Tap to change drawing',x:290,y:560,r:-4,a:[352,548,-80]},{t:'Tap to open room',x:12,y:560,r:-6,a:[40,548,-70]},{t:'Slide in your memory',x:30,y:700,r:-8,a:[110,705,-30]}],

async function toggleFriend(id){
  if(!ME||!id||id===ME.id)return false;
  const mine=Array.isArray(ME.friends)?ME.friends.slice():[];
  const on=!mine.includes(id);const nextMine=on?[...mine,id]:mine.filter(x=>x!==id);
  // Persist our side first. If this fails, do not change the UI state.
  await W(()=>DB.doc('accounts/'+ME.id).update({friends:nextMine}));
  ME={...ME,friends:nextMine};if(ACC[ME.id])ACC[ME.id]={...ACC[ME.id],friends:nextMine};
  // Update the other account too. Report partial failures instead of swallowing them.
  try{
    const other=await gd('accounts/'+id);
    if(other){const nextOther=Array.isArray(other.friends)?other.friends.slice():[];
      const updated=on?(nextOther.includes(ME.id)?nextOther:[...nextOther,ME.id]):nextOther.filter(x=>x!==ME.id);
      await W(()=>DB.doc('accounts/'+id).update({friends:updated}));ACC[id]={...ACC[id],...other,friends:updated};
    }
  }catch(e){console.warn('Friend reciprocity update failed',e);toast(on?'Added on your side, but the other account could not be updated.':'Removed on your side, but the other account could not be updated.',3600);return on}
  toast(on?`${dn(id)} is now your friend 🎉`:`Removed ${dn(id)} from friends`);return on
}

  const draw=async()=>{const seq=++latest;const q=$('#fq',host).value.trim().toLowerCase().replace(/^@/,'');const fr=ME?.friends||[];let accounts=Object.values(ACC);
    try{const snap=await DB.collection('accounts').get();accounts=snap.docs.map(d=>({id:d.id,...d.data()}));accounts.forEach(a=>ACC[a.id]=a)}catch(e){console.warn('Friend search refresh failed; using cached accounts',e)}
    if(seq!==latest||!host.isConnected)return;
    const hits=accounts.filter(a=>a.id!==ME?.id&&!fr.includes(a.id)&&(!q||String(a.id).toLowerCase().includes(q)||String(a.name||'').toLowerCase().includes(q))).sort((a,b)=>(b.created||0)-(a.created||0)).slice(0,30);
    $('#fres',host).innerHTML=hits.length?hits.map(a=>friendRow(a,false)).join(''):`<p class="muted" style="margin:12px 0 0">${emptyFriendsMsg(q.length+fr.length)}</p>`};

    // only the strokes, on a transparent background, trimmed to what was drawn
    const pad=8,o=document.createElement('canvas');o.width=bb.w+pad*2;o.height=bb.h+pad*2;o.getContext('2d').drawImage(cv,bb.x-pad,bb.y-pad,o.width,o.height,0,0,o.width,o.height);ov.remove();cb(o.toDataURL('image/png'))}}
function alphaBounds(cv){const {width:w,height:h}=cv,d=cv.getContext('2d').getImageData(0,0,w,h).data;let x0=w,y0=h,x1=-1,y1=-1;for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(d[(y*w+x)*4+3]>10){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}return x1<0?null:{x:x0,y:y0,w:x1-x0+1,h:y1-y0+1}}
const CAPCOL=['#2a2733','#e0607a','#5b6fd8','#3f9a5e','#f29a3a','#ffffff'];
function openCaption(cb){let col=CAPCOL[0];const ov=document.createElement('div');ov.className='ov';ov.style.background='rgba(191,220,247,.92)';ov.innerHTML=`<div class="padwrap capwrap" style="height:400px"><div class="pad circ" style="left:11px;top:30px;width:300px;height:300px;background:rgba(255,255,255,.55);border:2px dashed #9fb3d6"></div><textarea id="tx" maxlength="60" placeholder="type here"></textarea><div class="padlabel" style="top:-2px;bottom:auto;left:-60px;font-size:26px">Caption</div><div style="position:absolute;right:12px;top:-6px;display:flex;flex-direction:column;gap:6px"><button class="sv" id="ok">Save</button><button class="dl" id="cx">Delete</button></div><div class="sws">${CAPCOL.map((c,i)=>`<button data-c="${c}" class="${i?'':'on'}" style="background:${c}" aria-label="Text colour"></button>`).join('')}</div></div>`;$('#s-canvas').append(ov);const tx=$('#tx',ov);setTimeout(()=>tx.focus(),200);$('#cx',ov).onclick=()=>ov.remove();
  $('.sws',ov).onclick=e=>{const b=e.target.closest('button');if(!b)return;col=b.dataset.c;$$('.sws button',ov).forEach(x=>x.classList.toggle('on',x===b));tx.style.color=col==='#ffffff'?'#fff':col;tx.style.textShadow=col==='#ffffff'?'0 0 3px #2a2733':'none'};
  $('#ok',ov).onclick=()=>{const t=tx.value.trim();if(!t)return toast('Write a caption first');
    // text only on a transparent background, with a thin outline so it reads on photos
    const c=document.createElement('canvas'),x=c.getContext('2d'),F='600 44px Grandstander, sans-serif';x.font=F;const words=t.split(/\s+/),lines=[];let cur='';words.forEach(w=>{const tst=cur?cur+' '+w:w;if(x.measureText(tst).width>420&&cur){lines.push(cur);cur=w}else cur=tst});lines.push(cur);const L=lines.slice(0,5);
    const W2=Math.ceil(Math.max(...L.map(l=>x.measureText(l).width)))+24,H2=L.length*52+20;c.width=W2;c.height=H2;x.font=F;x.textAlign='center';x.textBaseline='middle';x.lineJoin='round';x.lineWidth=7;x.strokeStyle=col==='#ffffff'?'rgba(42,39,51,.85)':'rgba(255,255,255,.9)';x.fillStyle=col;
    L.forEach((l,i)=>{const y=10+26+i*52;x.strokeText(l,W2/2,y);x.fillText(l,W2/2,y)});ov.remove();cb(c.toDataURL('image/png'))}}
async function saveCanvas(){if(!ED.els.length)return toast('Add something to your canvas first');const r=room();if(!r)return;ED.sel=null;drawEls();
  // crop to what's on the canvas so zine pages aren't mostly empty
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;ED.els.forEach(o=>{const cx=o.x+o.w/2,cy=o.y+o.h/2,a=o.r*Math.PI/180,hw=(Math.abs(o.w*Math.cos(a))+Math.abs(o.h*Math.sin(a)))/2,hh=(Math.abs(o.w*Math.sin(a))+Math.abs(o.h*Math.cos(a)))/2;x0=Math.min(x0,cx-hw);x1=Math.max(x1,cx+hw);y0=Math.min(y0,cy-hh);y1=Math.max(y1,cy+hh)});
  const pad=18;x0=Math.max(0,x0-pad);y0=Math.max(0,y0-pad);x1=Math.min(350,x1+pad);y1=Math.min(640,y1+pad);let w=x1-x0,h=y1-y0;const side=Math.max(w,h,160);const cx=(x0+x1)/2,cy=(y0+y1)/2;x0=cx-side/2;y0=cy-side/2;w=h=side;
  const K=Math.min(2,700/side),c=document.createElement('canvas');c.width=Math.round(w*K);c.height=Math.round(h*K);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
  for(const o of ED.els){const im=await new Promise(res=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>res(null);i.src=o.src});if(!im)continue;x.save();x.translate((o.x+o.w/2-x0)*K,(o.y+o.h/2-y0)*K);x.rotate(o.r*Math.PI/180);x.drawImage(im,-o.w/2*K,-o.h/2*K,o.w*K,o.h*K);x.restore()}
  let q=.82,img=c.toDataURL('image/jpeg',q);while(img.length>180000&&q>.4){q-=.12;img=c.toDataURL('image/jpeg',q)}
  try{await W(()=>DB.doc('canvases/c'+nid()).set({room:r.id,cap:capCur(r),by:ME.id,img,at:Date.now()}))}catch(e){return}
  if(ED.origin==='door'){show('doors');sendAnim(img)}else{show('capsule');dropAnim(img)}}
async function sendAnim(img){const pg=$$('.dpage')[Math.max(0,ROOMS.findIndex(r=>r.id===CUR))];if(!pg)return;const slot=$('.slot',pg);const p=document.createElement('img');p.src=img;p.style.cssText='position:absolute;width:130px;height:130px;object-fit:cover;background:#fff;padding:5px;box-shadow:0 4px 10px rgba(0,0,0,.2);left:-30px;top:440px;z-index:65;pointer-events:none';fx.append(p);BUSY=true;
  await p.animate([{transform:'rotate(-35deg)'},{transform:'translate(170px,110px) rotate(-60deg) scale(.9)',offset:.5},{transform:'translate(190px,150px) rotate(-90deg) scale(.85,.85)'}],{duration:900,easing:'cubic-bezier(.4,0,.2,1)',fill:'forwards'}).finished;
  slot.classList.add('open');await p.animate([{transform:'translate(190px,150px) rotate(-90deg) scale(.85)',opacity:1},{transform:'translate(190px,190px) rotate(-90deg) scale(.85,.1)',opacity:0}],{duration:420,fill:'forwards'}).finished;p.remove();await wait(150);slot.classList.remove('open');BUSY=false;toast('Your memory slid into the capsule ✉️');changed()}
async function dropAnim(img){const p=document.createElement('img');p.src=img;p.style.cssText='position:absolute;width:130px;height:130px;object-fit:cover;background:#fff;padding:4px;left:136px;top:200px;z-index:65;pointer-events:none;box-shadow:0 4px 10px rgba(0,0,0,.2)';fx.append(p);await p.animate([{transform:'translateY(-200px) rotate(-10deg)',opacity:0},{transform:'translateY(150px) rotate(5deg)',opacity:1,offset:.6},{transform:'translateY(300px) rotate(0) scale(.6)',opacity:0}],{duration:1000,easing:'ease-in',fill:'forwards'}).finished;p.remove();toast('Added to the capsule ✨')}

/* ---------- test tools ---------- */
$('#dev').onclick=async e=>{const k=e.target.closest('button')?.dataset.dev;if(!k)return;$('#dev').classList.remove('open');
  if(!ME&&k!=='wipe')return toast('Sign in first');const r=room();
  if(k==='time'){if(!r)return toast('Open a room first');await W(()=>DB.doc('rooms/'+r.id).update({nextOpen:Date.now()-1000}));toast(`Opening time reached in ${r.name} — visit the gacha machine`)}
  if(k==='ready'){if(!r)return toast('Open a room first');const m={};r.members.filter(x=>x!==ME.id).forEach(x=>m[x]=true);await W(()=>DB.doc('rooms/'+r.id).update({ready:{[capCur(r)]:m}}));toast(`Everyone in ${r.name} is ready except you`)}
  if(k==='hints'){seen={};saveSeen();pendingHints.clear();if(['doors','room','shelf','gacha','capsule'].includes(curScreen))render(curScreen);toast('Hints will show again on each screen')}
  if(k==='out')signOut();
  if(k==='wipe'){if(MODE==='cloud')return;sheet(`<h3>Erase everything on this device?</h3><p class="muted">All test accounts, rooms and canvases saved in this browser will be deleted.</p><div class="row" style="margin-top:16px"><button class="ghost" id="k">Cancel</button><button class="btn" id="d" style="flex:1;background:#e07878;color:#fff">Erase</button></div>`,b=>{$('#k',b).onclick=closeSheet;$('#d',b).onclick=()=>{closeSheet();stopSubs();LOCAL.wipe();['ploop.me','ploop.recent'].forEach(LS.del);ME=null;show('signin')}})}
};
$('#devToggle').onclick=()=>$('#dev').classList.toggle('open');

/* ---------- boot ---------- */
(async()=>{show('load');await initStore();modeLabel();
  const last=LS.get('ploop.me',null);if(typeof last==='string'){try{const a=await gd('accounts/'+last);if(a){await enter(a);return}}catch(e){}}
  show('signin','a-fade')})();
}
